allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

# Transitive dependency overrides remediating Dependabot/security advisories.
# pnpm v11 promotes pnpm-workspace.yaml as the canonical location for overrides;
# the package.json "pnpm" field is deprecated in v11 (it still works in v10).
#
# Caret ranges (not open-ended ">=") keep builds reproducible and patch/minor
# fixes flowing while blocking surprise major bumps from `pnpm update` /
# Renovate lockFileMaintenance. Remove each entry once the direct dependency
# resolves a safe version on its own (run `pnpm audit` after dropping it).
overrides:
  # GHSA-52f5-9888-hmc6 — arbitrary temp file write via symlink (tmp <0.2.6)
  # via @anthropic-ai/mcpb > @inquirer/prompts > … > external-editor
  tmp: '^0.2.6'
  # GHSA-5v7r-6r5c-r473 — infinite loop in ASF parser (file-type <21.3.1); via evalite (dev)
  file-type: '^22.0.1'
  # Path traversal in directory listing, and an authorization bypass through
  # non-canonical URL paths (@fastify/static <10.1.2); via evalite (dev). The
  # patched line is a major, and evalite is the only consumer.
  '@fastify/static': '^10.1.2'
  # GHSA-6rw7-vpxm-498p — arrayLimit bypass DoS (qs <=6.15.1); via @modelcontextprotocol/sdk > express
  qs: '^6.15.2'
  # GHSA-gv7w-rqvm-qjhr — esbuild missing binary integrity verification (esbuild <0.28.1).
  # 24 transitive paths via @bitrix24/b24ui-nuxt > vite, @nuxtjs/mcp-toolkit > vite, etc.
  # Direct devDep is also bumped to ^0.28.1 in package.json — override pins every
  # transitive copy at the same fix level.
  esbuild: '^0.28.1'
  # GHSA-hmw2-7cc7-3qxx — CRLF injection in `form-data` (<4.0.6). Reachable in
  # PRODUCTION via `axios > form-data` from `@bitrix24/b24jssdk` (every outbound
  # REST call to Bitrix24 uses it). HIGH severity. Pin to the patched minor;
  # remove once axios upstream pulls the fix on its own.
  form-data: '^4.0.6'
  # GHSA-vmf3-w455-68vh — file-smuggling tar parser interpretation differential
  # (`tar` <=7.5.15) via `nuxt > @nuxt/nitro-server > nitropack > @vercel/nft >
  # @mapbox/node-pre-gyp > tar`. Build-only path; bumped defensively to keep
  # `pnpm audit` clean. Remove once the @vercel/nft chain ships >=7.5.16.
  tar: '^7.5.16'
  # Nuxt 4.6's builder imports `transformWithOxc`, which vite 8 exports and
  # vite 7 does not. The advisory this override was written for ended at 7.3.5,
  # so the eighth line covers it and the builder at once.
  # GHSA-v6wh-96g9-6wx3 — NTLMv2 hash disclosure via UNC path in `launch-editor`
  # (<=2.14.0). Reached via `vite` (>=7.0.0 <=7.3.4) and via `@nuxt/devtools`.
  # Windows-only attack surface, dev-mode editor-open path; pinned so `pnpm audit`
  # stays green on CI. Remove once Nuxt/Vite cut a fix on their own.
  vite: '^8.0.0'
  launch-editor: '^2.14.1'
  # GHSA-h67p-54hq-rp68 — quadratic-complexity DoS in `js-yaml` merge-key handling
  # (<=4.1.1) via `@commitlint/cli > cosmiconfig > js-yaml` and `@nuxt/eslint >
  # eslint-typegen > … > js-yaml`. Dev-only paths, but the audit gate is dev-aware
  # so pin to the patched minor.
  js-yaml: '^4.1.2'
  # GHSA-wwfh-h76j-fc44 / -j6c9-x7qj-28xf / -rv63-4mwf-qqc2 / -wgpf-jwqj-8h8p —
  # four hono advisories (<4.12.25): CORS reflects any Origin (HIGH); path
  # traversal in serve-static on Windows; AWS Lambda Set-Cookie merging; AWS
  # Lambda Body Limit bypass via Content-Length understatement; Lambda@Edge
  # header de-duplication. We reach `hono` ONLY transitively through
  # `@modelcontextprotocol/sdk > @hono/node-server > hono` (4 paths); we don't
  # use `serve-static`, we don't run on Lambda / Lambda@Edge, and we don't enable
  # the CORS middleware in any handler — but the audit gate doesn't care about
  # reachability and the patched version is a no-cost minor. Pin to clear it.
  hono: '^4.12.25'
  # GHSA-m8m8-qj5v-23w3 (HIGH) / -r4gj-5m52-g5wh (HIGH) / -j8rh-479h-cp32 /
  # -4hqw-qxg8-jxx2 / -44g4-m2mj-wpvx — five axios advisories (<1.20.0):
  # prototype-pollution gadget in the Node HTTP adapter; `maxRedirects: 0` not
  # enforced by the fetch adapter; header injection via inherited headers on
  # both the fetch and the xhr adapter; CIDR-form NO_PROXY entries ignored, so
  # traffic meant to bypass the proxy went through it. Reached transitively via
  # `@bitrix24/b24ui-nuxt > axios`; the audit gate fails on the two HIGH ones.
  # Pin to the patched minor; remove once b24ui ships it.
  axios: '^1.20.0'

# Advisories with no released fix. `node-forge` 1.4.0 and `braces` 3.0.3 are the
# newest published versions of each, and their advisories name 1.4.1 and 3.0.4
# as the fix. Both are transitive (nitropack's certificate helper and its glob
# matcher). Listing them here keeps the gate honest about everything else and
# makes the exception visible; delete an entry the day its patch ships.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
