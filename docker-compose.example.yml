# Local development compose — runs the MCP server alone, bound to host port 3000.
# For production (behind nginx-proxy on the shared proxy-net network) use docker-compose.yml.
services:
  bx24-template-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bx24-template-mcp-local
    restart: unless-stopped
    # Port mapping: <host>:<container>. The container side MUST match NITRO_PORT
    # below (and what the Dockerfile exposes). If you change NITRO_PORT, change
    # both the right-hand side here AND the Dockerfile EXPOSE/HEALTHCHECK.
    ports:
      - '3000:3000'
    environment:
      NUXT_BITRIX24_WEBHOOK_URL: ${NUXT_BITRIX24_WEBHOOK_URL}
      NUXT_MCP_AUTH_TOKEN: ${NUXT_MCP_AUTH_TOKEN}
      NUXT_GITHUB_FEEDBACK_TOKEN: ${NUXT_GITHUB_FEEDBACK_TOKEN:-}
      NUXT_GITHUB_FEEDBACK_REPO: ${NUXT_GITHUB_FEEDBACK_REPO:-bitrix24/templates-mcp}
      NUXT_LOG_LEVEL: ${NUXT_LOG_LEVEL:-info}
      NITRO_PORT: ${NITRO_PORT}
      NODE_ENV: ${NODE_ENV}
