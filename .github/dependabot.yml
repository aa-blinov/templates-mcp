version: 2
updates:
  # GitHub Actions — Renovate does not cover these in the current config
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Minsk
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Minsk
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  # npm — security-only to avoid duplicating Renovate PRs
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Minsk
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    commit-message:
      prefix: fix
      include: scope
