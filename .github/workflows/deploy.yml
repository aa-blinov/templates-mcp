name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/sha) to deploy'
        required: true
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ vars.PROD_HOST }}
    steps:
      - name: SSH — pull & up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/opt/bx24-template-mcp' }}"
            # Capture the currently running image digest for rollback.
            CURRENT_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' bx24-template-mcp 2>/dev/null || echo "")
            echo "previous=$CURRENT_DIGEST" >> rollback.env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Health check
        id: health
        run: |
          URL="https://${{ vars.PROD_HOST }}/api/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$URL" >/dev/null; then
              echo "Healthy after attempt $i."
              exit 0
            fi
            echo "Attempt $i/10 failed, sleeping 3s…"
            sleep 3
          done
          echo "Health check failed after 10 attempts." >&2
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/opt/bx24-template-mcp' }}"
            if [ -f rollback.env ] && grep -q '^previous=' rollback.env; then
              PREV=$(grep '^previous=' rollback.env | cut -d= -f2-)
              if [ -n "$PREV" ]; then
                echo "Rolling back to $PREV"
                docker pull "$PREV"
                # Swap image in compose by exporting an override.
                BX24_IMAGE="$PREV" docker compose up -d --remove-orphans
                exit 0
              fi
            fi
            echo "No previous image recorded — manual rollback required." >&2
            exit 1
